name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    # playwright-rs is pinned to git main, so the bundled driver version
    # floats. Key the driver cache on Cargo.lock (which pins the exact
    # playwright-rs commit) so a bump invalidates the cache and build.rs
    # reassembles the matching driver.
    - name: Cache Playwright Drivers (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/playwright-rust/drivers
          ~/Library/Caches/playwright-rust/drivers
        key: ${{ runner.os }}-playwright-drivers-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache Playwright Drivers (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\playwright-rust\drivers
        key: ${{ runner.os }}-playwright-drivers-${{ hashFiles('**/Cargo.lock') }}

    # Generate test fixtures (they're not committed)
    - name: Install ImageMagick (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y imagemagick libimage-exiftool-perl ffmpeg

    - name: Install ImageMagick (macOS)
      if: runner.os == 'macOS'
      run: brew install imagemagick exiftool ffmpeg

    - name: Install ImageMagick (Windows)
      if: runner.os == 'Windows'
      run: choco install imagemagick exiftool ffmpeg -y

    - name: Generate test fixtures (Unix)
      if: runner.os != 'Windows'
      run: ./scripts/setup-test-fixtures.sh

    - name: Generate test fixtures (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: ./scripts/setup-test-fixtures.sh

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    # Derive the assembled driver directory rather than hardcoding a version
    # (it floats with the git-main pin). Only chromium is needed — that is the
    # only browser folio's E2E tests launch.
    - name: Install Playwright browsers (Linux)
      if: runner.os == 'Linux'
      run: |
        DRIVER_DIR=$(ls -d ~/.cache/playwright-rust/drivers/playwright-*-linux 2>/dev/null | head -1)
        if [ -z "$DRIVER_DIR" ]; then
          echo "No playwright-rust driver assembled under ~/.cache/playwright-rust/drivers" >&2
          ls -la ~/.cache/playwright-rust/drivers 2>/dev/null || true
          exit 1
        fi
        echo "Using driver at $DRIVER_DIR"
        "$DRIVER_DIR/node" "$DRIVER_DIR/package/cli.js" install chromium --with-deps

    - name: Install Playwright browsers (macOS)
      if: runner.os == 'macOS'
      run: |
        DRIVER_DIR=$(ls -d "$HOME/Library/Caches/playwright-rust/drivers/"playwright-*-mac* 2>/dev/null | head -1)
        if [ -z "$DRIVER_DIR" ]; then
          echo "No playwright-rust driver assembled under $HOME/Library/Caches/playwright-rust/drivers" >&2
          ls -la "$HOME/Library/Caches/playwright-rust/drivers" 2>/dev/null || true
          exit 1
        fi
        echo "Using driver at $DRIVER_DIR"
        "$DRIVER_DIR/node" "$DRIVER_DIR/package/cli.js" install chromium

    - name: Install Playwright browsers (Windows)
      if: runner.os == 'Windows'
      run: |
        $driverDir = Get-ChildItem "$env:LOCALAPPDATA\playwright-rust\drivers" -Directory -Filter "playwright-*-win32_x64" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $driverDir) {
          Write-Error "No playwright-rust driver assembled under $env:LOCALAPPDATA\playwright-rust\drivers"
          exit 1
        }
        Write-Host "Using driver at $($driverDir.FullName)"
        & "$($driverDir.FullName)\node.exe" "$($driverDir.FullName)\package\cli.js" install chromium

    - name: Run tests (Linux/macOS)
      if: runner.os != 'Windows'
      run: cargo nextest run --profile ci --workspace

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 30
      run: cargo nextest run --profile ci --workspace --test-threads=1

    - name: Run doctests
      run: cargo test --doc --workspace

    - name: Generate documentation
      run: cargo doc --no-deps --workspace
