# cargo-mutants configuration
# Docs: https://mutants.rs/
#
# NOTE ON LOCATION: cargo-mutants (25.x) reads `.cargo/mutants.toml`. A
# `.mutants.toml` at the repo root is silently ignored, so this file lives
# under `.cargo/` on purpose.

# Use nextest — much faster than `cargo test`.
test_tool = "nextest"

# Run the whole workspace's tests against each mutant. cargo-mutants defaults
# to the mutated package's own tests, but the tests that kill a folio-core
# mutant often live a layer out (folio-cli's ingest integration tests).
test_workspace = true

# Browser E2E tests are the end-to-end gate, not a mutant-killer: they need
# installed Playwright browsers and a real launch per mutant, which turns an
# in-diff run from minutes into hours. Scope them out with a nextest filter
# rather than narrowing to --lib.
additional_cargo_test_args = ["-E", "not binary(browser_preview_test)"]

# Mutate only the hand-written logic crates. folio-cli is a driving adapter
# (covered by its integration/E2E tests at a layer where mutation yields
# surviving-mutant noise) and folio-examples is dataset-generation tooling.
# folio-ingest joins the list when it grows past its stub.
examine_globs = [
    "crates/folio-core/src/**/*.rs",
    "crates/folio-ingest/src/**/*.rs",
    "crates/folio-generator/src/**/*.rs",
]

# Exclude generated code once panschema output lands (story 002): generated
# modules are not hand-written logic — the schema is the source of truth and
# the generator is tested upstream.
exclude_globs = [
    "crates/*/src/generated/**/*.rs",
]

# Accepted survivors from the 2026-07-18 baseline sweep, encoded so the
# in-diff CI gate stays honest (green means every killable mutant is killed).
#
# preview.rs adapter surface — the HTTP server, WebSocket handlers, and the
# browser-open shim are exercised only by the browser E2E suite, which is
# filtered out of per-mutant runs above. This whole module is slated to move
# out of folio-core (a driving adapter per the roadmap's architecture
# direction); until then these functions are consciously outside mutation
# scope while the pure logic in the same file (generate_thumbnail, as_str,
# update_batch_name bounds, HTML generation) stays covered.
#
# The generate_thumbnail `> → >=` pair are equivalent mutants: at an exact
# max_size boundary both operators select the same branch (img.thumbnail is a
# no-op when the image already fits), so no test can distinguish them.
exclude_re = [
    "open_browser",
    "PreviewServer::has_browser",
    "PreviewServer::shutdown",
    "handle_socket",
    "ws_handler",
    "preview_handler_with_ws",
    "replace > with >= in generate_thumbnail",
    # folio-generator network backends and tool-availability probes: the
    # OpenAI/ComfyUI HTTP calls and the wait-loop's timing need a live server
    # to exercise, and the exiftool/ffmpeg probes both shell out and gate the
    # tests' skip-if-missing guards (so mutating them to `false` just skips the
    # guarded test). The pure logic they wrap — find_output_filename,
    # decode_image, the metadata/timeline/spec helpers — stays covered.
    "for OpenAiSource>::generate",
    "for ComfyUiSource>::generate",
    "ComfyUiSource::wait_for_image",
    "ComfyUiSource::api_url",
    "exiftool_available",
    "ffmpeg_available",
]
